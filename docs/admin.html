<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理画面 - 新作ソシャゲ情報まとめ（MVP）</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <h1>新作ソシャゲ情報まとめ</h1>
  <nav>
    <a href="index.html">一覧</a>
    <a href="admin.html" class="active">管理画面</a>
  </nav>
</header>

<main class="admin-page">
  <section class="admin-form">
    <h2 id="form-title">新しいタイトルを登録</h2>
    <form id="title-form">
      <input type="hidden" id="f-id">
      <label>タイトル名
        <input type="text" id="f-name" required>
      </label>
      <label>ジャンル
        <select id="f-genre"></select>
      </label>
      <label>配信日
        <input type="date" id="f-date" required>
      </label>
      <label>紹介文
        <textarea id="f-desc" rows="3"></textarea>
      </label>
      <label>App Storeリンク
        <input type="text" id="f-ios" placeholder="https://...">
      </label>
      <label>Google Playリンク
        <input type="text" id="f-android" placeholder="https://...">
      </label>
      <div class="form-actions">
        <button type="submit" class="primary-btn">保存</button>
        <button type="button" id="cancel-edit">キャンセル</button>
      </div>
    </form>
  </section>

  <section class="admin-list">
    <div class="admin-list-header">
      <h2>登録済みタイトル</h2>
      <button id="reset-seed" class="ghost-btn">初期データにリセット</button>
    </div>
    <table>
      <thead>
        <tr><th>タイトル名</th><th>ジャンル</th><th>配信日</th><th>操作</th></tr>
      </thead>
      <tbody id="title-table-body"></tbody>
    </table>
  </section>
</main>

<p class="mvp-note">
  ※このMVPでは、登録データはブラウザの localStorage に保存されます（このブラウザ内のみ有効な簡易実装です。本番実装ではサーバー側DBが必要です）。
</p>

<script src="js/seed-data.js"></script>
<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
